<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleep Wave Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.98);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .timer-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .timer-display.warning {
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .interval-count {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .time {
            color: white;
            font-size: 4rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .status {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
            margin-top: 10px;
            font-weight: 500;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 16px 24px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            grid-column: 1 / -1;
        }

        .btn-success {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .outcome-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .wake-lock-status {
            text-align: center;
            padding: 12px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #666;
        }

        .wake-lock-status.active {
            background: rgba(86, 171, 47, 0.1);
            color: #56ab2f;
        }

        .history-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .history-header h2 {
            color: #333;
            font-size: 1.5rem;
        }

        .btn-clear {
            padding: 8px 16px;
            background: #f45c43;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-clear:hover {
            background: #eb3349;
        }

        .history-item {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .history-item.success {
            border-left-color: #56ab2f;
        }

        .history-item.gave-up {
            border-left-color: #eb3349;
        }

        .history-date {
            font-size: 0.85rem;
            color: #999;
            margin-bottom: 5px;
        }

        .history-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-outcome {
            font-weight: 600;
            color: #333;
        }

        .history-intervals {
            color: #666;
            font-size: 0.9rem;
        }

        .empty-history {
            text-align: center;
            color: #999;
            padding: 40px;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .time {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>😴 Sleep Wave Timer</h1>
        <p class="subtitle">5-minute intervals with 30-second warnings</p>

        <div class="wake-lock-status" id="wakeLockStatus">
            Wake Lock: Not Active
        </div>

        <div class="timer-display" id="timerDisplay">
            <div class="interval-count" id="intervalCount">Interval: 0</div>
            <div class="time" id="timeDisplay">5:00</div>
            <div class="status" id="statusDisplay">Ready to start</div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="startBtn" onclick="toggleTimer()">Start Timer</button>
        </div>

        <div class="controls" id="resetControls" style="display: none;">
            <button class="btn btn-secondary" onclick="resetTimer()">Reset</button>
            <button class="btn btn-secondary" onclick="toggleTimer()">Pause</button>
        </div>

        <div class="outcome-buttons" id="outcomeButtons" style="display: none;">
            <button class="btn btn-success" onclick="markOutcome('asleep')">😴 Baby Fell Asleep</button>
            <button class="btn btn-danger" onclick="markOutcome('gave-up')">😓 Gave Up</button>
        </div>

        <div class="history-section">
            <div class="history-header">
                <h2>📊 History</h2>
                <button class="btn-clear" onclick="clearHistory()">Clear All</button>
            </div>
            <div id="historyList"></div>
        </div>
    </div>

    <script>
        const INTERVAL_DURATION = 5 * 60; // 5 minutes in seconds
        const WARNING_TIME = 30; // 30 seconds warning

        let timerInterval = null;
        let wakeLock = null;
        let currentIntervalCount = 0;
        let totalSeconds = INTERVAL_DURATION;
        let isRunning = false;
        let sessionStartTime = null;

        // Audio context for beeps
        let audioContext = null;

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playBeep(frequency = 800, duration = 200) {
            initAudio();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = frequency;
            oscillator.type = 'sine';

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration / 1000);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration / 1000);
        }

        function vibrate(pattern) {
            if ('vibrate' in navigator) {
                navigator.vibrate(pattern);
            }
        }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    updateWakeLockStatus(true);

                    wakeLock.addEventListener('release', () => {
                        updateWakeLockStatus(false);
                    });
                }
            } catch (err) {
                console.error('Wake Lock error:', err);
            }
        }

        function releaseWakeLock() {
            if (wakeLock) {
                wakeLock.release();
                wakeLock = null;
                updateWakeLockStatus(false);
            }
        }

        function updateWakeLockStatus(active) {
            const status = document.getElementById('wakeLockStatus');
            if (active) {
                status.textContent = '🔒 Wake Lock: Active (screen will stay on)';
                status.classList.add('active');
            } else {
                status.textContent = 'Wake Lock: Not Active';
                status.classList.remove('active');
            }
        }

        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (!sessionStartTime) {
                sessionStartTime = new Date();
            }

            isRunning = true;
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('resetControls').style.display = 'grid';
            document.getElementById('outcomeButtons').style.display = 'grid';

            requestWakeLock();

            timerInterval = setInterval(() => {
                totalSeconds--;

                if (totalSeconds === WARNING_TIME) {
                    // 30-second warning
                    showWarning();
                    playBeep(600, 300);
                    vibrate([200, 100, 200]);
                }

                if (totalSeconds <= 0) {
                    // Interval complete
                    completeInterval();
                }

                updateDisplay();
            }, 1000);

            updateDisplay();
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('resetControls').style.display = 'none';
            document.getElementById('statusDisplay').textContent = 'Paused';
            releaseWakeLock();
        }

        function resetTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            currentIntervalCount = 0;
            totalSeconds = INTERVAL_DURATION;
            sessionStartTime = null;

            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('resetControls').style.display = 'none';
            document.getElementById('outcomeButtons').style.display = 'none';
            document.getElementById('timerDisplay').classList.remove('warning');
            document.getElementById('statusDisplay').textContent = 'Ready to start';

            releaseWakeLock();
            updateDisplay();
        }

        function completeInterval() {
            currentIntervalCount++;
            totalSeconds = INTERVAL_DURATION;

            // Alert for interval completion
            playBeep(1000, 500);
            playBeep(1200, 500);
            vibrate([300, 100, 300, 100, 300]);

            document.getElementById('timerDisplay').classList.remove('warning');
            updateDisplay();
        }

        function showWarning() {
            document.getElementById('timerDisplay').classList.add('warning');
            document.getElementById('statusDisplay').textContent = '⚠️ 30 seconds remaining!';
        }

        function updateDisplay() {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const timeString = `${minutes}:${seconds.toString().padStart(2, '0')}`;

            document.getElementById('timeDisplay').textContent = timeString;
            document.getElementById('intervalCount').textContent = `Interval: ${currentIntervalCount}`;

            if (isRunning && totalSeconds > WARNING_TIME) {
                document.getElementById('statusDisplay').textContent = 'Timer running...';
                document.getElementById('timerDisplay').classList.remove('warning');
            }
        }

        function markOutcome(outcome) {
            const session = {
                timestamp: new Date().toISOString(),
                startTime: sessionStartTime,
                endTime: new Date(),
                intervals: currentIntervalCount,
                outcome: outcome,
                duration: calculateDuration()
            };

            saveToHistory(session);
            resetTimer();
            displayHistory();
        }

        function calculateDuration() {
            if (!sessionStartTime) return 0;
            const endTime = new Date();
            return Math.round((endTime - sessionStartTime) / 1000 / 60); // minutes
        }

        function saveToHistory(session) {
            let history = getHistory();
            history.unshift(session);
            // Keep only last 50 sessions
            if (history.length > 50) {
                history = history.slice(0, 50);
            }
            localStorage.setItem('sleepWaveHistory', JSON.stringify(history));
        }

        function getHistory() {
            const history = localStorage.getItem('sleepWaveHistory');
            return history ? JSON.parse(history) : [];
        }

        function displayHistory() {
            const history = getHistory();
            const historyList = document.getElementById('historyList');

            if (history.length === 0) {
                historyList.innerHTML = '<div class="empty-history">No sessions yet. Start your first timer!</div>';
                return;
            }

            historyList.innerHTML = history.map(session => {
                const date = new Date(session.timestamp);
                const dateString = date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
                const outcomeText = session.outcome === 'asleep' ? '😴 Baby Fell Asleep' : '😓 Gave Up';
                const outcomeClass = session.outcome === 'asleep' ? 'success' : 'gave-up';

                return `
                    <div class="history-item ${outcomeClass}">
                        <div class="history-date">${dateString}</div>
                        <div class="history-details">
                            <span class="history-outcome">${outcomeText}</span>
                            <span class="history-intervals">${session.intervals} interval${session.intervals !== 1 ? 's' : ''} (${session.duration} min)</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function clearHistory() {
            if (confirm('Are you sure you want to clear all history?')) {
                localStorage.removeItem('sleepWaveHistory');
                displayHistory();
            }
        }

        // Handle page visibility changes to maintain wake lock
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        // Initialize on load
        displayHistory();
        updateDisplay();
    </script>
</body>
</html>
