<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub HTML Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.98);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .input-section {
            margin-bottom: 30px;
            padding: 30px;
            border: 3px solid #667eea;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
        }

        .input-group {
            display: flex;
            gap: 15px;
            align-items: stretch;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .info {
            margin-top: 15px;
            padding: 15px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 8px;
            font-size: 0.9rem;
            color: #666;
        }

        .info strong {
            color: #667eea;
        }

        .error {
            margin-top: 15px;
            padding: 15px;
            background: rgba(220, 53, 69, 0.1);
            border: 2px solid rgba(220, 53, 69, 0.3);
            border-radius: 8px;
            color: #dc3545;
            font-weight: 500;
        }

        .success {
            margin-top: 15px;
            padding: 15px;
            background: rgba(40, 167, 69, 0.1);
            border: 2px solid rgba(40, 167, 69, 0.3);
            border-radius: 8px;
            color: #28a745;
            font-weight: 500;
        }

        .preview-container {
            margin-top: 30px;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            overflow: hidden;
            background: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .preview-header {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            padding: 15px 20px;
            border-bottom: 2px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .preview-header h3 {
            color: #333;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .preview-url {
            font-size: 0.85rem;
            color: #667eea;
            font-family: monospace;
            word-break: break-all;
        }

        #previewFrame {
            width: 100%;
            min-height: 600px;
            border: none;
            background: white;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-weight: 600;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid rgba(102, 126, 234, 0.1);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .input-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GitHub HTML Preview</h1>

        <div class="input-section">
            <div class="input-group">
                <input
                    type="text"
                    id="githubUrl"
                    placeholder="Paste GitHub URL (e.g., https://github.com/user/repo/blob/main/file.html)"
                    autocomplete="off"
                />
                <button id="loadBtn">Load Preview</button>
            </div>

            <div class="info">
                <strong>How to use:</strong> Paste a GitHub URL to any HTML file (e.g., from the file view page).
                The tool will automatically convert it to a raw URL and render the HTML content below.
            </div>

            <div id="errorMessage" class="error hidden"></div>
            <div id="successMessage" class="success hidden"></div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            Loading HTML content...
        </div>

        <div class="preview-container hidden" id="previewContainer">
            <div class="preview-header">
                <h3>Preview</h3>
                <div class="preview-url" id="rawUrl"></div>
            </div>
            <iframe id="previewFrame" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
        </div>
    </div>

    <script>
        const githubUrlInput = document.getElementById('githubUrl');
        const loadBtn = document.getElementById('loadBtn');
        const loading = document.getElementById('loading');
        const previewContainer = document.getElementById('previewContainer');
        const previewFrame = document.getElementById('previewFrame');
        const rawUrlDisplay = document.getElementById('rawUrl');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        // Load on button click
        loadBtn.addEventListener('click', loadPreview);

        // Load on Enter key
        githubUrlInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loadPreview();
            }
        });

        function convertToRawUrl(githubUrl) {
            try {
                const url = new URL(githubUrl);

                // Check if it's a GitHub URL
                if (!url.hostname.includes('github.com')) {
                    throw new Error('Not a GitHub URL');
                }

                // Extract parts from URL
                // Format: https://github.com/user/repo/blob/branch/path/to/file.html
                const pathParts = url.pathname.split('/');

                if (pathParts.length < 5 || pathParts[3] !== 'blob') {
                    throw new Error('Invalid GitHub file URL format. Expected format: github.com/user/repo/blob/branch/file.html');
                }

                const user = pathParts[1];
                const repo = pathParts[2];
                const branch = pathParts[4];
                const filePath = pathParts.slice(5).join('/');

                // Construct raw URL
                const rawUrl = `https://raw.githubusercontent.com/${user}/${repo}/${branch}/${filePath}`;

                return rawUrl;
            } catch (error) {
                throw new Error(error.message || 'Invalid URL format');
            }
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
            successMessage.classList.add('hidden');
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.remove('hidden');
            errorMessage.classList.add('hidden');
        }

        function hideMessages() {
            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');
        }

        async function loadPreview() {
            const githubUrl = githubUrlInput.value.trim();

            if (!githubUrl) {
                showError('Please enter a GitHub URL');
                return;
            }

            hideMessages();
            loading.classList.add('active');
            previewContainer.classList.add('hidden');
            loadBtn.disabled = true;

            try {
                // Convert to raw URL
                const rawUrl = convertToRawUrl(githubUrl);
                rawUrlDisplay.textContent = rawUrl;

                // Fetch the HTML content
                const response = await fetch(rawUrl);

                if (!response.ok) {
                    throw new Error(`Failed to fetch: ${response.status} ${response.statusText}`);
                }

                const htmlContent = await response.text();

                // Create a blob URL for the iframe
                const blob = new Blob([htmlContent], { type: 'text/html' });
                const blobUrl = URL.createObjectURL(blob);

                // Load into iframe
                previewFrame.src = blobUrl;

                // Show preview
                loading.classList.remove('active');
                previewContainer.classList.remove('hidden');
                showSuccess('HTML loaded successfully!');

                // Clean up blob URL after loading
                previewFrame.onload = function() {
                    setTimeout(() => URL.revokeObjectURL(blobUrl), 100);
                };

            } catch (error) {
                loading.classList.remove('active');
                showError(`Error: ${error.message}`);
                console.error('Error loading preview:', error);
            } finally {
                loadBtn.disabled = false;
            }
        }

        // Auto-focus input on load
        githubUrlInput.focus();
    </script>
</body>
</html>
